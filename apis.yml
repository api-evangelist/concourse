aid: concourse
name: Concourse
description: 'Concourse builds AI agents for corporate finance teams. Its platform lets
  finance, accounting, and data teams query financial data in natural language, generate
  board and investor reporting with commentary, and run forecasts and scenarios against
  real-time data. Concourse connects natively to financial and operational systems including
  QuickBooks, NetSuite, Ramp, Snowflake, Salesforce, HubSpot, Stripe, Brex, Rippling,
  Gusto, BigQuery, and Databricks, and says it cuts manual finance work by over 75%.
  The company is SOC 2 Type II certified and backed by CRV, raising a $12M Series A
  alongside general availability. This profile was surfaced from a VC portfolio and
  enriched by the API Evangelist pipeline.'
